[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-divergence-engine"
version = "0.1.0"
description = "Checks AI-generated code against the intent that produced it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ide = "intent_ide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
